name: CI and npm publish

# The tag glob here and the `if:` guards below must agree, or non-matching tags
# start runs that silently skip every meaningful job.
on:
  pull_request:
    branches:
      - main
      - "release/*"
  push:
    branches:
      - main
      - "release/*"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build_and_test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm # must match the lockfile committed to the repo

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test # `vitest run` — watch mode would hang CI until the 6h timeout

      - name: Build package
        run: npm run build

      # The committed generated code must match the committed spec, otherwise the
      # published types describe an API that no longer exists.
      - name: Check generated code is up to date with openapi.json
        run: |
          npm run codegen
          git diff --exit-code -- src/clients/generated \
            || { echo "::error::src/clients/generated is stale — run 'npm run codegen' and commit"; exit 1; }

  publish_npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build_and_test # the only thing stopping a broken tag from reaching npm
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write # keep ONLY together with --provenance
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js for npm
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org/ # writes the .npmrc that reads NODE_AUTH_TOKEN
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish package
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # npm *automation* token

  github_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build_and_test
      - publish_npm
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

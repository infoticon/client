name: CI and npm publish

# The tag glob here and the `if:` guards below must agree, or non-matching tags
# start runs that silently skip every meaningful job.
on:
  pull_request:
    branches:
      - main
      - "release/*"
  push:
    branches:
      - main
      - "release/*"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build_and_test:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in engines; 22 is what the publish job runs on.
        node: ["20", "22"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm # must match the lockfile committed to the repo

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test # `vitest run` — watch mode would hang CI until the 6h timeout

      - name: Build package
        run: npm run build

      # The committed generated code must match the committed spec, otherwise the
      # published types describe an API that no longer exists.
      - name: Check generated code is up to date with openapi.json
        run: |
          npm run codegen
          git diff --exit-code -- src/clients/generated \
            || { echo "::error::src/clients/generated is stale — run 'npm run codegen' and commit"; exit 1; }

  publish_npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build_and_test # the only thing stopping a broken tag from reaching npm
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write # required for OIDC — this IS the credential
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Matches npm's canonical trusted-publishing example. Node 24 bundles an npm
      # new enough for OIDC (>= 11.5.1), which removes the separate global-upgrade
      # step — that step installed npm 12 onto a Node version npm 12 does not
      # support, and it is one less moving part in a release build.
      #
      # Caching is off deliberately: npm's docs say never to cache in release
      # builds, so the published artifact is always built from a clean tree.
      - name: Setup Node.js for npm
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/

      - name: Report npm version
        run: npm --version # trusted publishing requires >= 11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      # No token: npm authenticates via the OIDC identity of this workflow, which
      # must be registered as a trusted publisher on the package
      # (org "infoticon", repo "client", workflow "ci-publish.yml").
      # `--provenance` is deliberately absent — trusted publishing attaches
      # provenance automatically, and passing the flag is redundant.
      - name: Publish package
        run: npm publish --access public

  github_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build_and_test
      - publish_npm
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
